<!DOCTYPE html>
<html lang="mn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enguun-д 💌</title>

    <style>
        .kitty-sticker {
            text-align: center;
            margin: 0 auto 20px;
        }

        .kitty-image {
            width: 220px;
            max-width: 75%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 6px 12px #f3a6cf66);
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #ffeaf2;
            color: #743653;
        }

        .card {
            position: relative;
            width: min(100%, 440px);
            margin: 24px auto;
            padding: 30px 22px;
            text-align: center;

            background: linear-gradient(160deg,
                    #fffafd 0%,
                    #fff0f7 55%,
                    #ffe3f0 100%);

            border: 4px solid #fff;
            border-radius: 36px;
            outline: 2px solid #ffc1dc;

            box-shadow:
                0 10px 25px #e98ab844,
                inset 0 0 0 3px #ffe1ef;

            overflow: visible;
        }

        /* Cute sticker decorations */
        .card::before {
            content: "♡  ✧  ♡";
            position: absolute;
            top: -18px;
            right: 18px;
            padding: 3px 12px;
            border-radius: 20px;
            background: #ffdeed;
            color: #e86ba6;
            font-size: 20px;
        }

        .card::after {
            content: "🐾";
            position: absolute;
            bottom: -18px;
            left: 18px;
            font-size: 27px;
            transform: rotate(-18deg);
        }

        .cat {
            font-size: 90px;
            margin: 10px 0;
        }

        h1 {
            color: #ec6598;
            font-size: 27px;
        }

        .question {
            font-size: 23px;
            line-height: 1.5;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        #yes {
            background: #f477a5;
            color: white;
        }

        #no {
            background: #fff0f5;
            color: #a44b72;
        }

        #answer {
            display: none;
            margin-top: 22px;
            font-size: 23px;
            font-weight: bold;
            color: #ec6598;
        }

        /* Cute kitty sticker */
        .kitty-sticker {
            width: 145px;
            height: 145px;
            margin: 0 auto 18px;
            border-radius: 42% 42% 45% 45%;
            background: linear-gradient(145deg, #fff5fb, #ffd9ed);
            border: 4px solid white;
            box-shadow: 0 6px 18px #f3a6cf66;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform: rotate(-4deg);
            position: relative;
        }

        .kitty-face {
            font-size: 76px;
            line-height: 1.1;
            filter: drop-shadow(0 3px 2px #e9a4c2);
        }

        .kitty-caption {
            font-size: 15px;
            color: #d85c98;
            font-weight: bold;
            margin-top: 4px;
        }

        .kitty-heart {
            position: absolute;
            top: -13px;
            right: -9px;
            font-size: 32px;
            transform: rotate(12deg);
        }
    </style>
</head>

<body>
    <div class="kitty-sticker">
        <img src="kitty-sticker.png" alt="Enguun-д зориулсан хөөрхөн муур" class="kitty-image">
    </div>
    <div class="card">
        <div class="cat">❤️💍❤️</div>

        <h1>For Enguun 💌</h1>

        <p class="question">
            Миний найз охин болох уу?
        </p>

        <button id="yes">Тийм, зөвшөөрье 💗</button>
        <button id="no">Бодож үзий 🙈</button>

        <div id="answer"></div>
    </div>

    <script>
        const yesButton = document.getElementById("yes");
        const noButton = document.getElementById("no");
        const answer = document.getElementById("answer");

        async function sendAnswer(choice) {
            try {
                const response = await fetch(
                    "https://formsubmit.co/ajax/tumbash81@gmail.com",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            _subject: "💌 Enguun-ийн урилгын хариулт",
                            answer: choice,
                            message: "Enguun-ийн хариулт: " + choice
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error("Email failed");
                }

                return true;
            } catch (error) {
                return false;
            }
        }

        async function chooseAnswer(choice) {
            yesButton.disabled = true;
            noButton.disabled = true;

            if (choice === "Тийм") {
                answer.innerHTML = "Хайртай шүү, Энгүүн ❤️❤️❤️";
            } else {
                answer.innerHTML =
                    "Зүгээр ээ 😊 Үнэнээ хэлсэнд баярлалаа ❤️";
            }

            answer.style.display = "block";

            const sent = await sendAnswer(choice);

            const status = document.createElement("p");
            status.style.fontSize = "13px";
            status.textContent = sent
                ? "Хариулт илгээх хүсэлт амжилттай боллоо 💌"
                : "Илгээж чадсангүй. Интернет болон тохиргоогоо шалгаарай.";
            answer.appendChild(status);
        }

        yesButton.addEventListener("click", () => chooseAnswer("Тийм"));
        noButton.addEventListener("click", () => chooseAnswer("Бодож үзий"));
    </script>
</body>

</html>
